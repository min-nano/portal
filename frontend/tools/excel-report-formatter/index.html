<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現況検査レポート作成ツール</title>
</head>
<body>
  <header class="portal-header">
    <span class="title"><a href="/">社内ポータル</a></span>
    <span class="account" id="accountArea" hidden>
      <span id="accountEmail"></span>
      <button type="button" id="signOutBtn">サインアウト</button>
    </span>
  </header>

  <div id="authGate" class="auth-gate" hidden>
    <p class="note">社内の Google アカウントでサインインしてください。</p>
    <div class="clerk-mount"></div>
  </div>

  <div id="app" class="container" hidden>
    <h2>傾斜測定 報告フォーム</h2>

    <div class="template-bar">
      <span class="label">使用中の Excel 雛形: </span>
      <span id="templateName" class="name">確認中...</span>
      <div>
        <button type="button" id="templateBtn">雛形を設定</button>
      </div>
    </div>

    <form id="reportForm" onsubmit="return false;">
      <label>住宅(物件)名</label>
      <input type="text" id="property_name" name="property_name">

      <div id="rooms"></div>
      <button type="button" class="add-room" id="addRoomBtn">＋ 部屋を追加</button>
      <p class="hint">部屋数は物件に合わせて増減できます（雛形の上限まで）。</p>

      <button type="button" id="submitBtn" disabled>Excel出力</button>
    </form>
    <div id="message"></div>
  </div>

  <!-- 雛形選択ダイアログ（Google Picker の代替）。実行ユーザーの権限で
       Drive を検索するため、本人に閲覧権限のあるファイルだけが候補になる。 -->
  <div id="templateDialog" class="dialog-backdrop" hidden>
    <div class="dialog">
      <h3>Excel 雛形を設定</h3>
      <p class="hint">
        Google Drive 上の雛形ファイル (.xlsx) をファイル名で検索して選択します。
        Google スプレッドシート形式は選択できません。
      </p>
      <div class="search-row">
        <input type="text" id="templateSearchInput" placeholder="ファイル名の一部を入力">
        <button type="button" id="templateSearchBtn">検索</button>
      </div>
      <div id="templateResults" class="template-results"></div>
      <button type="button" class="close" id="templateDialogClose">閉じる</button>
    </div>
  </div>

  <script type="module" src="/src/excel-report-formatter/main.js"></script>
</body>
</html>
