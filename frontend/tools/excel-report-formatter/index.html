<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現況検査レポート作成ツール</title>
</head>
<body>
  <!-- ヘッダーとサインインゲートは全ページ共通の部品（src/components/）。 -->
  <portal-header class="portal-header" portal-name="%PORTAL_TITLE%" home></portal-header>

  <portal-auth-gate id="authGate" class="auth-gate" hidden></portal-auth-gate>

  <div id="app" class="container" hidden>
    <!-- 雛形は滅多に変えないので、タイトル横に小さく置く（画面の幅が足りない
         ときは折り返して次の行の右端に来る）。 -->
    <div class="page-head">
      <h2>傾斜測定 報告フォーム</h2>
      <div class="template-chip">
        <span class="label">Excel 雛形:</span>
        <span id="templateName" class="name">確認中...</span>
        <!-- Google Drive のファイル選択は公式の Google Picker で行う
             （frontend/src/google-picker.js）。 -->
        <button type="button" id="templateBtn"
                title="Excel 形式 (.xlsx) のファイルだけを選べます（Google スプレッドシート形式は選択できません）。">
          設定
        </button>
      </div>
    </div>

    <form id="reportForm" onsubmit="return false;">
      <div class="cert-field field-half">
        <label for="property_name">住宅(物件)名</label>
        <input type="text" id="property_name" name="property_name">
      </div>

      <!-- 部屋は 1 つずつ折り畳める。入力済みの部屋を閉じておくと、
           入力中の部屋を探しやすい。 -->
      <portal-section-controls class="section-controls" for="rooms"></portal-section-controls>

      <div id="rooms"></div>
      <button type="button" class="add-room" id="addRoomBtn">＋ 部屋を追加</button>
      <p class="hint">部屋数は物件に合わせて増減できます（雛形の上限まで）。</p>

      <button type="button" id="submitBtn" disabled>Excel出力</button>
    </form>
    <div id="message"></div>
  </div>

  <script type="module" src="/src/excel-report-formatter/main.js"></script>
</body>
</html>
