<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小規模木造建築物 必要壁量 計算ツール</title>
</head>
<body>
  <!-- ヘッダーとサインインゲートは全ページ共通の部品（src/components/）。 -->
  <portal-header class="portal-header" portal-name="%PORTAL_TITLE%" home></portal-header>

  <portal-auth-gate id="authGate" class="auth-gate" hidden></portal-auth-gate>

  <div id="app" class="container" hidden>
    <!-- 同梱している表計算ツールの版は、雛形と同じくタイトル横に小さく置く。
         配布元へのリンクも添えて、原本を確かめられるようにする。 -->
    <div class="page-head">
      <h2>必要壁量 表計算ツール 入力フォーム</h2>
      <div class="template-chip">
        <span class="label">表計算ツール:</span>
        <span id="worksheetInfo"></span>
      </div>
    </div>

    <p class="hint">
      入力した値を、公益財団法人日本住宅・木材技術センターが配布している
      「壁量等の基準(令和7年施行)に対応した表計算ツール（多機能版）」へ書き込んだ
      Excel ファイル (.xlsx) をダウンロードします。提出物は配布物そのものなので、
      出力されるファイルの中の計算は、Excel で開いた時点で配布物の数式が行います。
      下の「出力結果」は、その数式と同じ計算をこの画面で行ったものです。
    </p>

    <!-- has-dock: 広い画面では入力（左）と出力結果（右）の 2 列になる。
         狭い画面ではそのまま縦に流れる（並び順は変わらない）。 -->
    <form id="worksheetForm" class="has-dock" onsubmit="return false;">
      <div class="wq-field field-half">
        <label for="buildingSelect">建物の種別</label>
        <select id="buildingSelect"></select>
      </div>

      <!-- 節は折り畳める。入力する箇所を探しやすいよう、まとめて開閉もできる。 -->
      <portal-section-controls class="section-controls" for="formArea"></portal-section-controls>

      <div id="formArea"></div>

      <!-- 出力結果（配布物のオレンジの枠に当たるところ）。入力のたびに
           計算し直す。中身は src/wall-quantity-calculator/form-dom.js が作る。
           result-dock: 広い画面では右の列に貼り付いて、入力しながらでも
           結果が見えるようにする。 -->
      <portal-section class="cert-section result-dock" id="resultsSection">
        <h3 slot="title">出力結果</h3>
        <p class="hint">
          入力に合わせてその場で計算しています。入力が足りないところは、
          配布物と同じく空欄（—）のままになります。
        </p>
        <div id="results"></div>
      </portal-section>

      <button type="button" id="submitBtn" disabled>Excel出力</button>
    </form>

    <ul id="errors" class="warnings" hidden></ul>
    <div id="message"></div>

    <!-- 狭い画面では出力結果が画面の外にあるので、そこへ飛ぶボタンを出す
         （広い画面では右の列に出ているので出さない）。 -->
    <a class="verdict-fab" href="#resultsSection">
      出力結果へ
      <span aria-hidden="true">↓</span>
    </a>
  </div>

  <script type="module" src="/src/wall-quantity-calculator/main.js"></script>
</body>
</html>
