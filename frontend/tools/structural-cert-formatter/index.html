<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>構造計算安全証明書 作成ツール</title>
</head>
<body>
  <header class="portal-header">
    <span class="title"><a href="/">%PORTAL_TITLE%</a></span>
    <span class="account" id="accountArea" hidden>
      <span id="accountEmail"></span>
      <button type="button" id="signOutBtn">サインアウト</button>
    </span>
  </header>

  <div id="authGate" class="auth-gate" hidden>
    <p class="note">社内の Google アカウントでサインインしてください。</p>
    <div class="clerk-mount"></div>
  </div>

  <div id="app" class="container" hidden>
    <h2>構造計算によって建築物の安全性を確かめた旨の証明書</h2>

    <div class="template-bar">
      <div>
        <span class="label">使用中の雛形（Google ドキュメント）: </span>
        <span id="templateName" class="name">確認中...</span>
      </div>
      <div>
        <span class="label">PDF の保存先フォルダ: </span>
        <span id="outputFolderName" class="name">確認中...</span>
      </div>
      <div>
        <button type="button" id="templateBtn">雛形を設定</button>
        <button type="button" id="outputFolderBtn">保存先を設定</button>
      </div>
    </div>

    <div class="edit-bar">
      <div>
        <span class="label">編集中のファイル: </span>
        <span id="sourceName" class="name">なし（新規作成）</span>
      </div>
      <div>
        <button type="button" id="loadBtn">Drive の PDF を読み込む</button>
        <button type="button" id="uploadBtn">手元の PDF を読み込む</button>
        <button type="button" id="resetBtn">新規作成に戻す</button>
        <!-- アップロードは解析するだけで Drive には保存しないため、Picker の
             アップロード画面ではなくブラウザのファイル選択を使う。 -->
        <input type="file" id="uploadInput" accept="application/pdf,.pdf" hidden>
      </div>
      <p class="hint" id="sourceNote" hidden></p>
    </div>

    <form id="certForm" onsubmit="return false;">
      <div id="sections"></div>

      <div class="save-bar">
        <h3>保存</h3>
        <label for="fileName">ファイル名</label>
        <input type="text" id="fileName" placeholder="構造計算安全証明書.pdf">
        <div class="save-modes">
          <label class="choice-option">
            <input type="radio" name="saveMode" value="new" checked>
            <span>新規保存（別名で保存する）</span>
          </label>
          <label class="choice-option">
            <input type="radio" name="saveMode" value="overwrite" id="overwriteMode" disabled>
            <span id="overwriteLabel">上書き保存（Drive から読み込んだファイルのみ）</span>
          </label>
        </div>
        <p class="hint">
          上書き保存でも、直前の内容はしばらくの間 Google Drive の版履歴から復元できます
          （古い版は Drive の自動整理で順次消えます）。
        </p>
        <button type="button" id="submitBtn" disabled>PDF を作成して保存</button>
      </div>
    </form>

    <div id="message"></div>
    <div id="result" hidden>
      <a id="resultLink" target="_blank" rel="noopener"></a>
    </div>
    <ul id="warnings" class="warnings" hidden></ul>
  </div>

  <script type="module" src="/src/structural-cert-formatter/main.js"></script>
</body>
</html>
