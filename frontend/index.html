<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>%PORTAL_TITLE%</title>
</head>
<body>
  <!-- ヘッダーとサインインゲートは全ページ共通の部品（src/components/）。
       id・class・hidden は、部品が読み込まれる前の描画のために HTML に置く。 -->
  <portal-header class="portal-header" portal-name="%PORTAL_TITLE%"></portal-header>

  <!-- 読み込み中の表示。サインインの確認が終わるまで（数秒かかることがある）
       出しておく。輪は CSS だけで回るので、JS を 1 行も読む前から出る。 -->
  <portal-loading id="pageLoading" class="page-loading">サインインを確認しています…</portal-loading>

  <portal-auth-gate id="authGate" class="auth-gate" hidden></portal-auth-gate>

  <div id="app" class="container" hidden>
    <h2>ツール一覧</h2>
    <!-- 中身はビルド時に組み立てる（tools-plugin.js）。並ぶのは
         tools.config.js に載っているツールで、名前も説明も各ツールが
         自分で名乗ったマニフェストから来る。ツールを増やしてもこのページは
         変わらない（docs/plugin-architecture.md §4.1）。 -->
    <ul class="tool-list"><!--PORTAL_TOOL_LIST--></ul>
  </div>

  <script type="module" src="/src/portal.js"></script>
</body>
</html>
