<!-- 雛形は滅多に変えないので、タイトル横に小さく置く（画面の幅が足りない
     ときは折り返して次の行の右端に来る）。 -->
<div class="page-head">
  <h2>傾斜測定 報告フォーム</h2>
  <div class="template-chip">
    <span class="label">Excel 雛形:</span>
    <!-- 押すと雛形の中身をポップアップで見られる（../template-preview.js）。
         確認中・未設定のあいだは押せない。 -->
    <button type="button" id="templateName" class="name" disabled>確認中...</button>
    <!-- Google Drive のファイル選択（frontend/src/drive-picker.js）。 -->
    <button type="button" id="templateBtn"
            title="Excel 形式 (.xlsx) のファイルだけを選べます（Google スプレッドシート形式は選択できません）。">
      設定
    </button>
  </div>
</div>

<form id="reportForm" onsubmit="return false;">
  <!-- 物件のデータシートと間取り図の写真から、物件名と部屋（階・室名）を入れる
       （photo-reading.js・room-dialog.js）。写真はこの端末の中で読むだけ。 -->
  <div class="photo-reading">
    <button type="button" class="secondary" id="photoReadBtn">写真から読み取る</button>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>
    <p class="hint">データシートの写真から物件名を、間取り図の写真から部屋（階・室名）を入れます。部屋は一覧で確かめてから入れます。資料は文字が縦向きのまま、正面から大きく撮ってください。写真はこの端末の中で読むだけで、どこにも送りません。</p>
  </div>

  <div class="field field-half">
    <label for="property_name">住宅(物件)名</label>
    <div class="field-row">
      <input type="text" id="property_name" name="property_name">
    </div>
  </div>

  <!-- 部屋は 1 つずつ折り畳める。入力済みの部屋を閉じておくと、
       入力中の部屋を探しやすい。 -->
  <portal-section-controls class="section-controls" for="rooms"></portal-section-controls>

  <div id="rooms"></div>
  <button type="button" class="add" id="addRoomBtn">＋ 部屋を追加</button>
  <p class="hint">部屋数は物件に合わせて増減できます（雛形の上限まで）。</p>

  <button type="button" id="submitBtn" disabled>Excel出力</button>
</form>
<div id="message"></div>
