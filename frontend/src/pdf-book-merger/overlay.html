<!-- 頁の拡大表示。一覧の縮小画像では傾きやすじが見分けにくいので、
     押した頁だけを大きく描き直して見せる。 -->
<dialog id="previewDialog" class="app-dialog bm-preview">
  <h3 id="previewTitle"></h3>
  <p id="previewIssues" class="hint"></p>
  <div class="bm-preview-image">
    <img id="previewImage" alt="">
  </div>
  <div class="dialog-actions">
    <button type="button" id="previewPrevBtn" class="secondary">前の頁</button>
    <button type="button" id="previewNextBtn" class="secondary">次の頁</button>
    <button type="button" id="previewCloseBtn">閉じる</button>
  </div>
</dialog>

<!-- Drive への保存（名前を付けて保存）。保存の考え方は他の PDF ツールと同じ。 -->
<portal-save-dialogs name-placeholder="書名.pdf"></portal-save-dialogs>
