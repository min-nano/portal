name: Claude

# PR エージェント（Claude Code）を `@claude` のメンションで呼び出す。
# 自動レビュー（claude-review.yml）は Ready for review への切り替え時に 1 回だけ
# 走るので、その後の再レビュー・質問・修正の依頼はここから行う。
#
#   PR / issue のコメント、PR のレビュー、レビューのインラインコメントに
#   `@claude ...` と書くと、その内容を指示として動く。
#
# 呼び出しは明示的なので、下書きの PR でも動く（作業中に相談したいとき用）。
# 起動できるのはリポジトリへの書き込み権限を持つ人だけ（アクション側で確認する）。
#
# 認証は claude-review.yml と同じく WIF（README「Claude による PR レビュー
# （PR エージェント）」参照）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # 修正を頼まれたときにブランチへ push するため write。
      contents: write
      pull-requests: write
      issues: write
      # GitHub の OIDC トークンの取得に使う（Anthropic への WIF と、Claude
      # GitHub App のトークン取得の両方）。
      id-token: write
      # CI の結果を読めるようにする（additional_permissions と対）。
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Check required repository variables
        env:
          ANTHROPIC_FEDERATION_RULE_ID: '${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}'
          ANTHROPIC_ORGANIZATION_ID: '${{ vars.ANTHROPIC_ORGANIZATION_ID }}'
          ANTHROPIC_SERVICE_ACCOUNT_ID: '${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}'
        run: |
          .github/scripts/require-vars.sh \
            ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          # anthropic_api_key は渡さないこと（静的な鍵があると WIF より優先される）。
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
