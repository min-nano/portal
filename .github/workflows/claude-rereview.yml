name: Claude re-review

# Claude の再レビュー。claude-review.yml は Ready の PR を 1 回だけレビューする
# ので、その後の変更（指摘への対応など）は見ない。ここでは **前回の判定から
# 後の変更** をレビューし直し、判定（Approve / Request changes）を出し直す。
#
# 起動するのは:
#
#   push      判定のある Ready の PR に push したとき（pull_request の
#             synchronize）。判定がまだ無い PR（最初のレビューの前）は飛ばす
#   コメント  PR に `/claude-rereview` とコメントしたとき（issue_comment）。
#             コメントしたのがリポジトリの所有者・メンバー・コラボレーターの
#             場合だけ（公開リポジトリなので、誰でも API の利用料を使えない
#             ようにする）。push を待たずにやり直したいとき（失敗した実行の
#             やり直しなど）に使う
#
# 続けて push したときは、同じ PR の実行は 1 本ずつで、待っている実行は新しい
# ものに置き換わる（concurrency）ので、まとめて 1 回になりやすい。
#
# issue_comment の実行はデフォルトブランチ（main）のこのファイルで動き、
# OIDC トークンの `sub` も `...:ref:refs/heads/main` になる。WIF の rule は、
# pull_request イベントと、main のこのワークフローの issue_comment だけを
# 通すように絞ってある（README「Claude による PR レビュー（PR エージェント）」）。
# 同じ理由で、コメントでの起動はこのファイルの変更が main に入ってから効く。
#
# スクリプト（.github/scripts）はこのワークフローと同じコミット（push では
# PR のマージコミット、コメントでは main）のものを使い、レビュー対象の PR の
# head は別のディレクトリ（pr/）に取り出す。
#
# 再レビューの流れ:
#
#   1. 前回の判定（claude-review-status.sh の verdict_sha）が無ければ、
#      push では飛ばし、コメントでは失敗にする（最初のレビューがまだ。
#      Ready への切り替えや開き直しで付ける）
#   2. 前回の判定から head が変わっていなければ、何もせずに終える
#   3. プラグインの手順で、前回の head からの差分をレビューする。前回までの
#      指摘が直っていなければ、それも指摘として付け直す（claude-review.mjs）。
#      force push で前回の head が祖先でなくなっていたら、PR 全体を見る
#   4. 以降は claude-review.yml と同じ。レビューが付いたかを確かめ、判定を出す
#
# 新しい判定は前の判定を置き換える（GitHub は同じレビュアーの最新の判定を
# 有効にする）。
#
# 対象外の PR（下書き・bot・フォーク）は claude-review.yml と同じ。

on:
  pull_request:
    types: [synchronize]
  issue_comment:
    types: [created]

# claude-review.yml と同じグループにして、同じ PR のレビューと重ならないように
# する。走っている実行は止めない。
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rereview:
    name: Re-review
    # pull_request は、Ready・人の PR・フォークでないものだけ。issue_comment は
    # PR へのコメントで、本文が `/claude-rereview` で始まり、書き込み権限の
    # ある人が付けたものだけ（PR の条件は下の Resolve で見る）。
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/claude-rereview') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # GitHub の OIDC トークンの取得に使う（Anthropic への WIF）。
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Check required repository variables
        env:
          ANTHROPIC_FEDERATION_RULE_ID: '${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}'
          ANTHROPIC_ORGANIZATION_ID: '${{ vars.ANTHROPIC_ORGANIZATION_ID }}'
          ANTHROPIC_SERVICE_ACCOUNT_ID: '${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}'
        run: |
          .github/scripts/require-vars.sh \
            ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID
      - name: Resolve the pull request
        # コメントのイベントには PR の head などが無いので、どちらのイベントでも
        # API から取る（push の場合も、待っている間に進んだ head を見る）。
        # コメントで起動して対象外の PR だったら、失敗にして気付けるようにする。
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          info="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")"
          field() { jq -r "$1" <<< "$info"; }
          reason=''
          if [ "$(field .state)" != 'open' ]; then reason='閉じています'
          elif [ "$(field .draft)" = 'true' ]; then reason='下書きです'
          elif [ "$(field .user.type)" = 'Bot' ]; then reason='bot の PR です'
          elif [ "$(field .head.repo.full_name)" != "$GITHUB_REPOSITORY" ]; then reason='フォークからの PR です'
          fi
          if [ -n "$reason" ]; then
            if [ "$GITHUB_EVENT_NAME" = 'issue_comment' ]; then
              echo "::error::PR #${PR} は${reason}。再レビューの対象外です。"
              exit 1
            fi
            echo "::notice::PR #${PR} は${reason}。再レビューしません。"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "eligible=true"
            echo "head_sha=$(field .head.sha)"
            echo "url=$(field .html_url)"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the pull request head
        # 前回の head との差分を取るため、履歴ごと取る。
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
      - name: Find the previous verdict
        id: before
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claude-review-status.sh
      - name: Decide what to review
        # run が false なら、レビューせずに終える。base は差分の起点で、前回の
        # head が今の head の祖先でなければ空（PR 全体を見る）。
        id: plan
        if: steps.pr.outputs.eligible == 'true'
        working-directory: pr
        env:
          VERDICT: ${{ steps.before.outputs.verdict }}
          PREVIOUS_SHA: ${{ steps.before.outputs.verdict_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" != 'true' ]; then
            message="PR #${PR} にはまだ Claude の判定がありません。最初のレビューは Ready for review への切り替え（または開き直し）で走ります（claude-review.yml）。"
            if [ "$GITHUB_EVENT_NAME" = 'issue_comment' ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::notice::$message"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREVIOUS_SHA" = "$HEAD_SHA" ]; then
            echo "::notice::前回の判定（${PREVIOUS_SHA}）から変更が無いので、再レビューしません。"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=''
          if git cat-file -e "${PREVIOUS_SHA}^{commit}" 2> /dev/null &&
              git merge-base --is-ancestor "$PREVIOUS_SHA" "$HEAD_SHA"; then
            base="$PREVIOUS_SHA"
            echo "前回の判定（${PREVIOUS_SHA}）からの差分を再レビューします。"
          else
            echo "::warning::前回の判定の head（${PREVIOUS_SHA}）が今の head の祖先ではありません（force push など）。PR 全体を再レビューします。"
          fi
          {
            echo "run=true"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
      - name: Record the start time
        id: start
        if: steps.plan.outputs.run == 'true'
        run: echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the Agent SDK and the plugin
        if: steps.plan.outputs.run == 'true'
        run: .github/scripts/claude-review-setup.sh
      - name: Re-review with the code-review plugin's procedure
        if: steps.plan.outputs.run == 'true'
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.PR }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PREVIOUS_SHA: ${{ steps.before.outputs.verdict_sha }}
          REVIEW_BASE: ${{ steps.plan.outputs.base }}
          REVIEW_DIR: ${{ github.workspace }}/pr
        run: node "$RUNNER_TEMP/claude-review/claude-review.mjs"
      - name: Check that the review was posted
        id: after
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.since }}
          RETRIES: '5'
        run: .github/scripts/claude-review-status.sh
      - name: Fail when the re-review was not posted
        if: steps.plan.outputs.run == 'true' && steps.after.outputs.state == 'open' && steps.after.outputs.reviewed != 'true'
        run: |
          echo "::error::PR #${PR} の再レビューが付きませんでした。実行ログを確認し、PR に \`/claude-rereview\` とコメントしてやり直してください。"
          exit 1
      - name: Submit the review verdict
        if: steps.plan.outputs.run == 'true' && steps.after.outputs.state == 'open' && steps.after.outputs.reviewed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INLINE: ${{ steps.after.outputs.inline }}
          CLEAN: ${{ steps.after.outputs.clean }}
          KIND: 再レビュー
        run: .github/scripts/claude-review-verdict.sh
