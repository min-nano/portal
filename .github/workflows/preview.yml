name: Preview

# PR ごとに、フロントエンド・バックエンド・共有設定のすべてを本番から切り離した
# プレビュー環境を作る。
#
#   Hosting    : プレビューチャンネル pr-<番号>
#   Clerk      : 開発（テスト）インスタンス
#   Cloud Run  : PR ごとのサービス portal-api-pr-<番号>（このワークフローが自動生成）
#   Firestore  : preview-channels/pr-<番号>/tool_settings（同一 DB 内で分離）
#
# バックエンドを PR ごとに立てるため、本番の Cloud Run は本番インスタンスの
# トークンと本番オリジンだけを受け付ければよく、プレビュー用の発行者・
# オリジンパターンを併記する必要がない（README「PR プレビュー」参照）。
#
# デプロイの順序に意味がある。Hosting のリライト先 Cloud Run サービスは
# チャンネルのデプロイ時点で存在している必要があるため、Cloud Run が先。
#
# PR クローズ時の後片付け（チャンネル・サービス・Firestore データの削除）は
# preview-cleanup.yml に分けてある（同じワークフローに入れると、クローズ以外の
# イベントのたびに削除ジョブが「スキップ」としてチェック一覧に並んでしまうため）。

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同じ PR への連続 push は最後のものだけデプロイされればよい。
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Preview environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check required repository variables
        # 未設定のリポジトリ変数は空文字として展開され、gcloud はそれを
        # 「未指定」として受け入れてしまう。--service-account '' なら Compute
        # 既定 SA、CLERK_ISSUER= なら認証設定なし、といった具合に、壊れた
        # プレビュー環境が「成功」として出来上がる。先にここで落とす。
        env:
          PROJECT_ID: '${{ vars.PROJECT_ID }}'
          WIF_PROVIDER: '${{ vars.WIF_PROVIDER }}'
          SA_EMAIL: '${{ vars.SA_EMAIL }}'
          SITE_ID: '${{ vars.SITE_ID }}'
          RUNTIME_SA_EMAIL: '${{ vars.RUNTIME_SA_EMAIL }}'
          CLERK_PUBLISHABLE_KEY_TEST: '${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}'
          ALLOWED_EMAIL_DOMAINS: '${{ vars.ALLOWED_EMAIL_DOMAINS }}'
          GOOGLE_PICKER_API_KEY: '${{ vars.GOOGLE_PICKER_API_KEY }}'
        run: |
          .github/scripts/require-vars.sh \
            PROJECT_ID WIF_PROVIDER SA_EMAIL SITE_ID RUNTIME_SA_EMAIL \
            CLERK_PUBLISHABLE_KEY_TEST ALLOWED_EMAIL_DOMAINS
          # Google Picker の API キーだけは、未設定でもジョブを落とさず警告に
          # とどめる。上の変数と違って「壊れ方が黙って隠れる」ことがないため
          # （渡さなければバックエンドが configured: false を返し、画面が
          # 環境変数名を挙げて「Google Picker が未設定です」と案内する）。
          # ファイル選択以外はそのまま試せるので、プレビューの作成は続ける。
          [ -n "$GOOGLE_PICKER_API_KEY" ] || echo "::warning::リポジトリ変数 GOOGLE_PICKER_API_KEY が未設定のため、このプレビューでは Google Drive のファイル選択（Google Picker）を使えません（README「4. Google Picker」参照）。"
      - name: Derive the Clerk issuer from the publishable key
        # バックエンドの CLERK_ISSUER は Publishable Key から一意に決まるため、
        # 別のリポジトリ変数として二重管理せず導出する（導出の詳細と、開発
        # インスタンスのキーであることの確認は clerk-issuer.sh 側）。
        env:
          KEY: '${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}'
        run: |
          issuer="$(.github/scripts/clerk-issuer.sh "$KEY" pk_test_ CLERK_PUBLISHABLE_KEY_TEST)"
          echo "CLERK_ISSUER_TEST=$issuer" >> "$GITHUB_ENV"
          echo "プレビューの Clerk issuer: $issuer"
      - name: Build the calculation core
        # 釘配列諸定数の唯一の計算実装（core/）を wasm にして
        # backend/app/wasm/ へ置く。成果物はコミットしていないので、デプロイの
        # たびにここで作る（本番の deploy.yml と同じ）。
        run: core/build.sh
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build (Clerk test instance)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: '${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}'
          # 表示名は本番と揃える（未設定なら「社内ポータル」）。
          VITE_PORTAL_TITLE: '${{ vars.PORTAL_TITLE }}'
        run: |
          cd frontend
          npm ci
          npm run build
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.SA_EMAIL }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy preview backend to Cloud Run
        # 本番（deploy.yml）と同じく、ランタイム SA と環境変数を毎回すべて渡す。
        # 環境ごとに違うのは値だけで、出どころはどちらもリポジトリ変数。
        # サービスが無ければ作成、あれば更新となるため、初回だけ手動で作る
        # 必要もない。
        #
        # CLERK_AUTHORIZED_PARTIES にはプレビュー URL の実際のホスト名では
        # なくパターンを渡す。チャンネル URL のハッシュ部分はデプロイするまで
        # 分からないが、pr-<番号>- までは PR 番号だけで決まるため、この PR の
        # チャンネルだけに絞ったうえで Cloud Run を先にデプロイできる。
        #
        # --no-invoker-iam-check で呼び出し側の IAM チェックを外す。Hosting の
        # リライトは匿名で呼ぶため、これが無いと /api/** が 403 になる。本番の
        # portal-api も同じ方法で公開されている（allUsers への束縛ではなく、
        # チェック自体の無効化。ドメイン制限共有 iam.allowedPolicyMemberDomains
        # のある組織では allUsers を IAM ポリシーに書けないため、こちらを使う）。
        # サービスは Cloud Run の URL でも到達可能になるが、認可はアプリ層の
        # Clerk JWT 検証で行うため、JWT が無ければ 401 で弾かれる。
        #
        # 値にカンマ（複数指定）を含むため、区切り文字を ; に変える ^;^ 記法を使う。
        env:
          GOOGLE_PICKER_API_KEY: '${{ vars.GOOGLE_PICKER_API_KEY }}'
          GOOGLE_PICKER_APP_ID: '${{ vars.GOOGLE_PICKER_APP_ID }}'
        run: |
          env_vars="CLERK_ISSUER=$CLERK_ISSUER_TEST"
          env_vars="$env_vars;CLERK_AUTHORIZED_PARTIES=https://${{ vars.SITE_ID }}--pr-$PR-*.web.app"
          env_vars="$env_vars;ALLOWED_EMAIL_DOMAINS=${{ vars.ALLOWED_EMAIL_DOMAINS }}"
          env_vars="$env_vars;DWD_SERVICE_ACCOUNT_EMAIL=${{ vars.RUNTIME_SA_EMAIL }}"
          env_vars="$env_vars;SETTINGS_CHANNEL_PATH=preview-channels/pr-$PR"
          # Google Picker の設定は、リポジトリ変数がある場合だけ渡す（空の環境
          # 変数を作らない。未設定なら画面が「未設定です」と案内する）。
          if [ -n "$GOOGLE_PICKER_API_KEY" ]; then
            env_vars="$env_vars;GOOGLE_PICKER_API_KEY=$GOOGLE_PICKER_API_KEY"
          fi
          if [ -n "$GOOGLE_PICKER_APP_ID" ]; then
            env_vars="$env_vars;GOOGLE_PICKER_APP_ID=$GOOGLE_PICKER_APP_ID"
          fi
          gcloud run deploy "portal-api-pr-$PR" \
            --source backend \
            --region asia-northeast1 \
            --project '${{ vars.PROJECT_ID }}' \
            --service-account '${{ vars.RUNTIME_SA_EMAIL }}' \
            --no-invoker-iam-check \
            --set-env-vars "^;^$env_vars" \
            --quiet
      - name: Point /api/** at the preview backend
        # チャンネルのデプロイはそのときの firebase.json をリリースに焼き込む
        # ため、ここでの書き換えはこの PR のチャンネルにだけ効く（本番の
        # リライト先は firebase.json のまま portal-api）。
        run: |
          jq --arg service "portal-api-pr-$PR" \
            '.hosting.rewrites |= map(if .run then .run.serviceId = $service else . end)' \
            firebase.json > firebase.json.tmp
          mv firebase.json.tmp firebase.json
      - name: Deploy to preview channel
        id: deploy
        run: |
          npx firebase-tools@latest hosting:channel:deploy "pr-$PR" \
            --project '${{ vars.PROJECT_ID }}' \
            --expires 7d \
            --non-interactive \
            --json > channel.json
          echo "url=$(jq -r '.result | to_entries[0].value.url' channel.json)" >> "$GITHUB_OUTPUT"
      - name: Check that /api/** reaches the preview backend
        # プレビュー URL からバックエンドまで実際に通ることを毎回確かめる。
        # ここを省くと、Hosting のリライト先が届かない（403 など）状態でも
        # ジョブは成功し、URL を貼られた人が初めて気付くことになる。
        # /api/healthz は認証不要なので、200 ならリライトが機能している。
        #
        # チャンネルへデプロイした直後は、リライトが CDN へ行き渡るまで
        # /api/** が 404 を返すことがある。この待ちは秒単位から数分までばらつく
        # ので、待ち time を 3 分ほど取る（以前は 50 秒で、反映が遅い回だけ
        # 落ちて再実行で通る、という当たり外れになっていた）。届かないまま
        # 3 分が過ぎるのは設定が違っているときなので、そこで初めて落とす。
        run: |
          url='${{ steps.deploy.outputs.url }}/api/healthz'
          attempts=18
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)"
            [ "$code" = "200" ] && { echo "疎通確認 OK: $url（試行 $attempt）"; exit 0; }
            echo "試行 $attempt/$attempts: HTTP $code（チャンネルの反映待ちの可能性あり）"
            [ "$attempt" -lt "$attempts" ] && sleep 10
          done
          echo "::error::プレビューの /api/** がバックエンドに届いていません（最後の応答: HTTP $code）。$url"
          exit 1
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview -->';
            const body = [
              marker,
              '🔍 **プレビューデプロイ**: ${{ steps.deploy.outputs.url }}',
              '',
              '- コミット: ${{ github.event.pull_request.head.sha }}',
              '- チャンネル: `pr-${{ env.PR }}`（最終デプロイから 7 日で失効、push ごとに更新）',
              '- 認証は Clerk の開発（テスト）インスタンスを使用します。',
              '- バックエンド: Cloud Run `portal-api-pr-${{ env.PR }}`（この PR 専用）',
              '- 共有設定: Firestore `preview-channels/pr-${{ env.PR }}/tool_settings`（本番と分離。雛形の設定はこの PR 内でやり直しが必要です）',
              '',
              'バックエンド・共有設定とも本番から切り離されているため、この URL での操作が本番に影響することはありません。PR クローズ時にまとめて削除されます。',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
