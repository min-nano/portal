name: Preview

# PR ごとに、フロントエンド・バックエンド・共有設定のすべてを本番から切り離した
# プレビュー環境を作る。
#
#   Hosting    : プレビューチャンネル pr-<番号>
#   Clerk      : 開発（テスト）インスタンス
#   Cloud Run  : PR ごとのサービス portal-api-pr-<番号>（このワークフローが自動生成）
#   Firestore  : preview-channels/pr-<番号>/tool_settings（同一 DB 内で分離）
#
# バックエンドを PR ごとに立てるため、本番の Cloud Run は本番インスタンスの
# トークンと本番オリジンだけを受け付ければよく、プレビュー用の発行者・
# オリジンパターンを併記する必要がない（README「PR プレビュー」参照）。
#
# デプロイの順序に意味がある。Hosting のリライト先 Cloud Run サービスは
# チャンネルのデプロイ時点で存在している必要があるため、Cloud Run が先。
#
# PR クローズ時の後片付け（チャンネル・サービス・Firestore データの削除）は
# preview-cleanup.yml に分けてある（同じワークフローに入れると、クローズ以外の
# イベントのたびに削除ジョブが「スキップ」としてチェック一覧に並んでしまうため）。

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同じ PR への連続 push は最後のものだけデプロイされればよい。
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Preview environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check required repository variables
        # 未設定のリポジトリ変数は空文字として展開され、gcloud はそれを
        # 「未指定」として受け入れてしまう。--service-account '' なら Compute
        # 既定 SA、CLERK_ISSUER= なら認証設定なし、といった具合に、壊れた
        # プレビュー環境が「成功」として出来上がる。先にここで落とす。
        env:
          PROJECT_ID: '${{ vars.PROJECT_ID }}'
          WIF_PROVIDER: '${{ vars.WIF_PROVIDER }}'
          SA_EMAIL: '${{ vars.SA_EMAIL }}'
          SITE_ID: '${{ vars.SITE_ID }}'
          RUNTIME_SA_EMAIL: '${{ vars.RUNTIME_SA_EMAIL }}'
          CLERK_PUBLISHABLE_KEY_TEST: '${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}'
          ALLOWED_EMAIL_DOMAINS: '${{ vars.ALLOWED_EMAIL_DOMAINS }}'
        run: |
          missing=()
          for name in PROJECT_ID WIF_PROVIDER SA_EMAIL SITE_ID RUNTIME_SA_EMAIL \
                      CLERK_PUBLISHABLE_KEY_TEST ALLOWED_EMAIL_DOMAINS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::リポジトリ変数が未設定です: ${missing[*]}（README「PR プレビュー」参照）"
            exit 1
          fi
      - name: Derive the Clerk issuer from the publishable key
        # Clerk の Publishable Key は pk_test_<base64> の形で、デコードすると
        # Frontend API のホスト名 + "$" になる。バックエンドの CLERK_ISSUER は
        # そこから一意に決まるため、別のリポジトリ変数として二重管理せず導出する
        # （鍵とインスタンスの食い違いが原理的に起きない）。
        env:
          KEY: '${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}'
        run: |
          # pk_live_ を誤って設定すると、プレビューが本番の Clerk インスタンスを
          # 向いてしまう。開発インスタンスのキーであることを先に確かめる。
          case "$KEY" in
            pk_test_*) ;;
            *)
              echo "::error::CLERK_PUBLISHABLE_KEY_TEST は開発インスタンスのキー（pk_test_...）である必要があります。"
              exit 1
              ;;
          esac
          encoded="${KEY#pk_test_}"
          # Clerk のキーは base64 のパディングを落としているため補う。
          while [ $(( ${#encoded} % 4 )) -ne 0 ]; do encoded="${encoded}="; done
          if ! host="$(printf '%s' "$encoded" | base64 -d 2>/dev/null)"; then
            echo "::error::CLERK_PUBLISHABLE_KEY_TEST をデコードできませんでした。"
            exit 1
          fi
          host="${host%\$}"
          case "$host" in
            ''|*[!a-zA-Z0-9.-]*)
              echo "::error::CLERK_PUBLISHABLE_KEY_TEST から取り出したホスト名が不正です: '${host}'"
              exit 1
              ;;
          esac
          echo "CLERK_ISSUER_TEST=https://$host" >> "$GITHUB_ENV"
          echo "プレビューの Clerk issuer: https://$host"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build (Clerk test instance)
        env:
          VITE_CLERK_PUBLISHABLE_KEY: '${{ vars.CLERK_PUBLISHABLE_KEY_TEST }}'
        run: |
          cd frontend
          npm ci
          npm run build
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.SA_EMAIL }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy preview backend to Cloud Run
        # 本番（deploy.yml）と違い、設定は毎回すべて渡す。サービスが無ければ
        # 作成、あれば更新となり、初回だけ手動で作る必要がない。
        #
        # CLERK_AUTHORIZED_PARTIES にはプレビュー URL の実際のホスト名では
        # なくパターンを渡す。チャンネル URL のハッシュ部分はデプロイするまで
        # 分からないが、pr-<番号>- までは PR 番号だけで決まるため、この PR の
        # チャンネルだけに絞ったうえで Cloud Run を先にデプロイできる。
        #
        # 値にカンマ（複数指定）を含むため、区切り文字を ; に変える ^;^ 記法を使う。
        run: |
          gcloud run deploy "portal-api-pr-$PR" \
            --source backend \
            --region asia-northeast1 \
            --project '${{ vars.PROJECT_ID }}' \
            --service-account '${{ vars.RUNTIME_SA_EMAIL }}' \
            --set-env-vars "^;^CLERK_ISSUER=$CLERK_ISSUER_TEST;CLERK_AUTHORIZED_PARTIES=https://${{ vars.SITE_ID }}--pr-$PR-*.web.app;ALLOWED_EMAIL_DOMAINS=${{ vars.ALLOWED_EMAIL_DOMAINS }};DWD_SERVICE_ACCOUNT_EMAIL=${{ vars.RUNTIME_SA_EMAIL }};SETTINGS_ROOT=preview-channels/pr-$PR/tool_settings" \
            --quiet
      - name: Allow unauthenticated invocations
        # gcloud run deploy の --allow-unauthenticated は、権限不足で IAM を
        # 設定できなくても警告どまりで終了コード 0 を返す（「Setting IAM
        # Policy...warning」）。それでは Hosting のリライト（匿名で呼ぶ）が
        # 403 になるプレビューが「成功」として通ってしまうため、束縛は
        # 権限不足でちゃんと失敗するこのコマンドで明示的に行う。
        #
        # デプロイ用 SA に roles/run.admin が必要（run.developer には
        # run.services.setIamPolicy が含まれない）。アプリ層の認可は Clerk の
        # JWT 検証で行うため、公開されていても JWT が無ければ 401。
        run: |
          gcloud run services add-iam-policy-binding "portal-api-pr-$PR" \
            --region asia-northeast1 \
            --project '${{ vars.PROJECT_ID }}' \
            --member allUsers \
            --role roles/run.invoker \
            --quiet
      - name: Point /api/** at the preview backend
        # チャンネルのデプロイはそのときの firebase.json をリリースに焼き込む
        # ため、ここでの書き換えはこの PR のチャンネルにだけ効く（本番の
        # リライト先は firebase.json のまま portal-api）。
        run: |
          jq --arg service "portal-api-pr-$PR" \
            '.hosting.rewrites |= map(if .run then .run.serviceId = $service else . end)' \
            firebase.json > firebase.json.tmp
          mv firebase.json.tmp firebase.json
      - name: Deploy to preview channel
        id: deploy
        run: |
          npx firebase-tools@latest hosting:channel:deploy "pr-$PR" \
            --project '${{ vars.PROJECT_ID }}' \
            --expires 7d \
            --non-interactive \
            --json > channel.json
          echo "url=$(jq -r '.result | to_entries[0].value.url' channel.json)" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview -->';
            const body = [
              marker,
              '🔍 **プレビューデプロイ**: ${{ steps.deploy.outputs.url }}',
              '',
              '- コミット: ${{ github.event.pull_request.head.sha }}',
              '- チャンネル: `pr-${{ env.PR }}`（最終デプロイから 7 日で失効、push ごとに更新）',
              '- 認証は Clerk の開発（テスト）インスタンスを使用します。',
              '- バックエンド: Cloud Run `portal-api-pr-${{ env.PR }}`（この PR 専用）',
              '- 共有設定: Firestore `preview-channels/pr-${{ env.PR }}/tool_settings`（本番と分離。雛形の設定はこの PR 内でやり直しが必要です）',
              '',
              'バックエンド・共有設定とも本番から切り離されているため、この URL での操作が本番に影響することはありません。PR クローズ時にまとめて削除されます。',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
