name: Claude review

# PR エージェント（Claude Code）による自動レビュー。レビューの中身は Anthropic
# 公式の code-review プラグイン（`/code-review:code-review`）に任せ、ここでは
# プロンプトを書かない。何を見るか・どの指摘を捨てるかはプラグインが決める
# （並列のエージェントで CLAUDE.md 準拠とバグを見て、確信度の低い指摘を捨てる）。
# リポジトリ固有の観点は CLAUDE.md に書けば、プラグインがそれに照らして見る。
#
# API は Claude Platform を Workload Identity Federation（WIF）で使う。GitHub の
# OIDC トークンを短命の Anthropic トークンに交換するので、API キー（Secrets）は
# 持たない。
#
# 無駄打ちを防ぐため、レビューするのは **Ready の PR に 1 回だけ**。運用は
#
#   1. PR は下書きで作る（作業中の push ではレビューが走らない）
#   2. 案がまとまったら「Ready for review」に切り替える → ここで 1 回レビュー
#
# 走るのは、PR が Ready の状態になったとき:
#
#   ready_for_review  下書きから Ready へ
#   opened            最初から Ready で開いた
#   reopened          Ready のまま開き直した（閉じる前にレビューが付かなかった
#                     場合の取りこぼしを拾う）
#
# synchronize（push）では走らせない。どの場合も、既に判定（Approve /
# Request changes）まで済んでいればプラグインを起動せずに終える
# （claude-review-status.sh）。
#
# プラグインは「レビュー不要」「Claude が既にコメントした」と判断すると何も
# 書かずに終わる。そのまま緑で終えると、Ready なのに未レビューの PR が
# 気付かれずに残るので、最後にレビューが付いたかを確かめ、付いていなければ
# ジョブを失敗にする。
#
# レビューが付いたら、その結果を PR のレビュー（Approve / Request changes）として
# 出す。指摘があればプラグインはインラインコメントを付け、無ければ
# 「No issues found」のコメントを 1 件付けるので、判定はそれに従う
# （判定はここで機械的に行い、プラグインには何も足さない）。
#
# bot（Dependabot など）の PR は対象外。依存の更新は CI とプレビューで見る。
#
# 必要な設定（Claude Console 側の WIF、GitHub App、リポジトリ変数）は
# README「Claude による PR レビュー（PR エージェント）」を参照。

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# 同じ PR のレビューは 1 本ずつ。走っている実行は止めない（途中で止めると、
# コメントを一部だけ付けて判定の無い状態が残る）。後から来た実行は待ち、
# 前の実行が判定まで済ませていれば何もせずに終わる。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    name: Review
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # GitHub の OIDC トークンの取得に使う（Anthropic への WIF と、Claude
      # GitHub App のトークン取得の両方）。
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Check required repository variables
        # 未設定のリポジトリ変数は空文字として展開される。WIF の値が欠けると
        # 交換は「Authentication failed」としか返らず原因が読めないので、
        # 先にここで変数名を挙げて落とす。
        env:
          ANTHROPIC_FEDERATION_RULE_ID: '${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}'
          ANTHROPIC_ORGANIZATION_ID: '${{ vars.ANTHROPIC_ORGANIZATION_ID }}'
          ANTHROPIC_SERVICE_ACCOUNT_ID: '${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}'
        run: |
          .github/scripts/require-vars.sh \
            ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID
      - name: Check that this workflow matches the default branch
        # Claude GitHub App は、このワークフローが既定ブランチのものと同一で
        # なければトークンを出さない（PR から書き換えたワークフローで App の
        # 権限を使わせないための仕組み）。その場合アクションは何もせず緑で
        # 終わるので、このワークフロー自体を足す・変える PR は Claude では
        # レビューできない。未レビューの赤（後段）と区別するため、ここで
        # 判定して警告を出し、以降を飛ばす。
        id: workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW: .github/workflows/claude-review.yml
        # 取得の失敗（5xx・レート制限など）は「違う」と区別して落とす。
        # 同じ扱いにすると、誤った理由の警告だけで未レビューのまま緑になる。
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/claude-review.base.yml"
          err="$RUNNER_TEMP/claude-review.base.err"
          if gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GITHUB_REPOSITORY/contents/$WORKFLOW?ref=$DEFAULT_BRANCH" > "$base" 2> "$err"; then
            if cmp -s "$base" "$WORKFLOW"; then
              echo "same=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q 'HTTP 404' "$err"; then
            cat "$err" >&2
            echo "::error::$DEFAULT_BRANCH の $WORKFLOW を取得できませんでした。一時的な障害であれば、このジョブを再実行してください。"
            exit 1
          fi
          # 既定ブランチに無い（404）か、内容が違う。
          echo "same=false" >> "$GITHUB_OUTPUT"
          echo "::warning::この PR は $WORKFLOW を追加・変更しているため（$DEFAULT_BRANCH と内容が違う）、Claude のレビューは行えません。人がレビューしてください。"
      - name: Check for an existing verdict
        # 判定（Approve / Request changes）まで済んでいれば、ここで終える。
        id: before
        if: steps.workflow.outputs.same == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claude-review-status.sh
      - name: Record the start time
        # この実行で付いたコメントだけを数えるための基準。GitHub 側の時刻との
        # ずれを見込んで 1 分前にする。
        id: start
        if: steps.before.outputs.verdict == 'false'
        run: echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        if: steps.before.outputs.verdict == 'false'
        with:
          # WIF。これらは ID であって秘密ではないので、Variables に置く。
          # anthropic_api_key は渡さないこと（静的な鍵があると WIF より優先される）。
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # ルールが 1 つのワークスペースだけを対象にしているなら空でよい。
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # レビューの指示そのもので、このリポジトリのコードの動作には関わらない
          # ため、バージョンは固定せず毎回最新を取る（公式のマーケットプレイス）。
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # track_progress は使わない。進捗コメントを先に付けると、プラグインが
          # 「Claude が既にコメントした PR」と見なしてレビューを飛ばす。
          prompt: /code-review:code-review --comment ${{ github.event.pull_request.html_url }}
          # この実行（agent モード）では、ここに挙げたツールしか使えない。
          # プラグインのコマンドが宣言しているもの（gh と、インライン
          # コメントの MCP）に、サブエージェントの起動と読み取りを足したもの。
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Agent,Task,TodoWrite,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
      - name: Check that the review was posted
        id: after
        if: steps.before.outputs.verdict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.since }}
          RETRIES: '5'
        run: .github/scripts/claude-review-status.sh
      - name: Fail when a ready PR is left unreviewed
        # 実行中に下書きへ戻された・閉じられた PR は、Ready ではないので問わない。
        if: steps.before.outputs.verdict == 'false' && steps.after.outputs.state == 'open' && steps.after.outputs.reviewed != 'true'
        run: |
          echo "::error::PR #${PR} は Ready ですが、レビューが付きませんでした。プラグインが「レビュー不要」または「Claude が既にコメント済み」と判断した可能性があります。実行ログを確認してください。"
          echo "::error::PR に claude[bot] のコメントが既にある場合（\`@claude\` とのやり取りや、中断された実行の残りなど）は、プラグインが毎回同じ理由で飛ばすため、再実行では解消しません。人がレビューするか、それらのコメントを消してから再実行してください。"
          exit 1
      - name: Submit the review verdict
        # 指摘あり（インラインコメントがある）→ Request changes、
        # 「No issues found」のまとめだけ → Approve。どちらでもない（まとめは
        # あるが「No issues found」を含まない）なら、判定せずに落とす。
        #
        # 本文の目印（claude-review-status.sh の MARKER）が「判定まで済んだ」の
        # 印になる。
        #
        # 出すのは GITHUB_TOKEN（github-actions[bot]）。Claude GitHub App の
        # トークンはアクションの終わりで失効するため、ここでは使えない。
        # Approve には Settings → Actions → General の「Allow GitHub Actions to
        # create and approve pull requests」が要る（howtec-worksheet-check.yml の
        # PR 作成と同じ設定）。
        if: steps.before.outputs.verdict == 'false' && steps.after.outputs.state == 'open' && steps.after.outputs.reviewed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INLINE: ${{ steps.after.outputs.inline }}
          CLEAN: ${{ steps.after.outputs.clean }}
          MARKER: '<!-- claude-review-verdict -->'
        run: |
          set -euo pipefail
          if [ "$INLINE" -gt 0 ]; then
            gh pr review "$PR" --request-changes \
              --body "$(printf '%s\n\nClaude のレビューで指摘が %s 件ありました。インラインコメントを確認してください。' "$MARKER" "$INLINE")"
          elif [ "$CLEAN" -gt 0 ]; then
            if ! gh pr review "$PR" --approve \
                --body "$(printf '%s\n\nClaude のレビューで指摘はありませんでした。' "$MARKER")"; then
              echo "::error::Approve できませんでした。Settings → Actions → General の「Allow GitHub Actions to create and approve pull requests」が有効か確認してください（README「Claude による PR レビュー（PR エージェント）」参照）。"
              exit 1
            fi
          else
            echo "::error::Claude のまとめコメントに「No issues found」が無く、インラインコメントもありません。指摘の有無を判定できないので、まとめコメントを確認して人が判定してください。"
            exit 1
          fi
