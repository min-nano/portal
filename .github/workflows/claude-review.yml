name: Claude review

# PR エージェント（Claude Code）による自動レビュー。API は Claude Platform を
# Workload Identity Federation（WIF）で使う。GitHub の OIDC トークンを短命の
# Anthropic トークンに交換するので、API キー（Secrets）は持たない。
#
# 無駄打ちを防ぐため、**下書き（draft）の PR はレビューしない**。運用は
#
#   1. PR は下書きで作る（作業中の push ではレビューが走らない）
#   2. 案がまとまったら「Ready for review」に切り替える → ここで 1 回レビュー
#   3. 指摘を直した後にもう一度見てほしければ、PR に `@claude` でコメントする
#      （claude.yml が拾う）。あるいは下書きに戻して、まとまったら再度 Ready に
#
# synchronize（push）では走らせない。Ready 後の細かな修正のたびに PR 全体を
# 読み直すのは、ほとんどが同じ指摘の繰り返しになるため。
#
# 下書きを経ずに最初から Ready で開いた PR（opened）も 1 回レビューする。
# bot（Dependabot など）の PR は対象外。依存の更新は CI とプレビューで見る。
#
# 必要な設定（Claude Console 側の WIF、GitHub App、リポジトリ変数）は
# README「Claude による PR レビュー（PR エージェント）」を参照。

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# 同じ PR のレビューは最新の 1 本だけでよい（Ready → 下書き → Ready と
# 素早く切り替えたときなど）。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # GitHub の OIDC トークンの取得に使う（Anthropic への WIF と、Claude
      # GitHub App のトークン取得の両方）。
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Check required repository variables
        # 未設定のリポジトリ変数は空文字として展開される。WIF の値が欠けると
        # 交換は「Authentication failed」としか返らず原因が読めないので、
        # 先にここで変数名を挙げて落とす。
        env:
          ANTHROPIC_FEDERATION_RULE_ID: '${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}'
          ANTHROPIC_ORGANIZATION_ID: '${{ vars.ANTHROPIC_ORGANIZATION_ID }}'
          ANTHROPIC_SERVICE_ACCOUNT_ID: '${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}'
        run: |
          .github/scripts/require-vars.sh \
            ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          # WIF。これらは ID であって秘密ではないので、Variables に置く。
          # anthropic_api_key は渡さないこと（静的な鍵があると WIF より優先される）。
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # ルールが 1 つのワークスペースだけを対象にしているなら空でよい。
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR をレビューしてください。PR のブランチは作業ディレクトリに
            チェックアウト済みです。差分は `gh pr diff`、説明は `gh pr view` で読めます。

            見てほしい観点（重要な順）:
            - 正しさ: バグ、境界条件、計算結果の誤り（core/ の計算はグレー本・配布物の
              表計算ツールと一致している必要がある）
            - セキュリティ: 認証・権限（Clerk の JWT 検証、許可ドメイン、Firestore
              ルール）、秘密情報の扱い、ワークフローの権限
            - テスト: 変更に見合うテストがあるか、既存テストの意図を壊していないか
            - ドキュメント: README などの説明が変更と食い違っていないか（このリポジトリは
              README に設計の理由まで書いているので、挙動を変えたら README も直すのが原則）

            書き方:
            - 日本語で書く。
            - 具体的な問題はインラインコメント
              （`mcp__github_inline_comment__create_inline_comment`、`confirmed: true`）で、
              該当行に付ける。問題が無い箇所への称賛や、好みの範囲の指摘は書かない。
            - 全体の所見は短くまとめる（重大な指摘の有無・件数が一目で分かるように）。
            - コードは変更しない（レビューだけを行う）。
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
