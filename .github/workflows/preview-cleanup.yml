name: Preview cleanup

# PR クローズ時に、preview.yml が作ったプレビュー環境を丸ごと片付ける。
#
#   Hosting          : プレビューチャンネル pr-<番号>
#   Cloud Run        : サービス portal-api-pr-<番号>
#   Artifact Registry: そのサービスのソースデプロイで積まれたイメージ
#   Firestore        : preview-channels/pr-<番号> 配下
#
# 削除対象はいずれも preview-channels / pr-<番号> という命名に閉じている。
# 本番の共有設定は static-channels 配下にあり、このワークフローがどう壊れても
# 到達しない。
#
# デプロイ側（preview.yml）とはトリガーを分けている。同じワークフローに入れて
# if で振り分けると、push のたびに削除ジョブが「スキップ」としてチェック一覧に
# 出てしまうため。
#
# 各ステップは「もともと無い」と「消せなかった」を区別する。前者（既に失効・
# 削除済み）は正常として続行し、後者（権限不足など）はジョブを失敗させる。
# 以前は一律に || true としていたが、それでは恒久的な失敗も握り潰され、
# ゴミが溜まり続けても誰も気付かない。
#
# 「もともと無い」を正常扱いにしたことで、このワークフローは冪等になった。
# 途中のステップで失敗しても、原因を直して再実行すれば残りが片付く
# （既に消えた分は正常として素通りする）。

on:
  pull_request:
    types: [closed]

# preview.yml と同じグループ。PR クローズ時に、まだ走っているデプロイを打ち切る。
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-preview:
    name: Delete preview environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.SA_EMAIL }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Delete Hosting channel
        # チャンネルは最終デプロイから 7 日で自動失効するため、クローズ時点で
        # 既に無いことが普通にある。
        run: |
          if out="$(npx firebase-tools@latest hosting:channel:delete "pr-$PR" \
              --project '${{ vars.PROJECT_ID }}' --force 2>&1)"; then
            echo "$out"
          elif grep -qiE '404|not found|does not exist' <<<"$out"; then
            echo "$out"
            echo "チャンネル pr-$PR は既にありません（失効済みなど。正常）"
          else
            echo "$out"
            echo "::error::Hosting チャンネル pr-$PR を削除できませんでした"
            exit 1
          fi
      - name: Delete Cloud Run service
        run: |
          if out="$(gcloud run services delete "portal-api-pr-$PR" \
              --region asia-northeast1 \
              --project '${{ vars.PROJECT_ID }}' \
              --quiet 2>&1)"; then
            echo "$out"
          elif grep -qiE 'NOT_FOUND|Cannot find service|could not be found' <<<"$out"; then
            echo "$out"
            echo "サービス portal-api-pr-$PR は既にありません（正常）"
          else
            echo "$out"
            echo "::error::Cloud Run サービス portal-api-pr-$PR を削除できませんでした"
            exit 1
          fi
      - name: Delete container images
        # ソースデプロイのイメージはサービス名ごとのパスに積まれるため、
        # このパスを消せばこの PR の分だけが消える。
        run: |
          image="asia-northeast1-docker.pkg.dev/${{ vars.PROJECT_ID }}/cloud-run-source-deploy/portal-api-pr-$PR"
          if out="$(gcloud artifacts docker images delete "$image" --delete-tags --quiet 2>&1)"; then
            echo "$out"
          elif grep -qiE 'NOT_FOUND|not found|does not exist' <<<"$out"; then
            echo "$out"
            echo "イメージ $image は既にありません（正常）"
          else
            echo "$out"
            echo "::error::コンテナイメージ $image を削除できませんでした"
            exit 1
          fi
      - name: Delete preview settings in Firestore
        # ドキュメントを消してもサブコレクションは消えないため再帰削除する。
        #
        # ここだけ「もともと無い」の判定が要らない。--recursive 指定時、
        # firestore:delete は対象が無くても終了コード 0 で終わる（Firestore の
        # 削除自体が冪等で、削除対象が 0 件なら何もせず完了する）。一方、権限
        # 不足はコレクションの列挙に失敗して非ゼロになる。つまり非ゼロは常に
        # 本物の失敗であり、そのままジョブを落としてよい。
        run: |
          npx firebase-tools@latest firestore:delete "preview-channels/pr-$PR" \
            --recursive \
            --force \
            --project '${{ vars.PROJECT_ID }}'
