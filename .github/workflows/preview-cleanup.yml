name: Preview cleanup

# PR クローズ時に Firebase Hosting のプレビューチャンネル（pr-<番号>）を削除する。
# デプロイ側（preview.yml）とはトリガーを分けている。同じワークフローに入れて
# if で振り分けると、push のたびに削除ジョブが「スキップ」としてチェック一覧に
# 出てしまうため。

on:
  pull_request:
    types: [closed]

# preview.yml と同じグループ。PR クローズ時に、まだ走っているデプロイを打ち切る。
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-preview:
    name: Delete preview channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.SA_EMAIL }}'
      - name: Delete channel
        # チャンネルが既に失効・削除済みでも失敗にしない。
        run: |
          npx firebase-tools@latest hosting:channel:delete "pr-${{ github.event.pull_request.number }}" \
            --project '${{ vars.PROJECT_ID }}' \
            --force || true
