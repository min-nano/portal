name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# The test jobs only need to read the repository contents.
permissions:
  contents: read

jobs:
  test-core:
    name: Core (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run tests
        # 釘配列諸定数の計算そのものを検証するのはここだけ（グレー本の計算例・
        # 各関数・入力検証）。画面もサーバも、この実装を wasm として動かす。
        # toolchain は core/rust-toolchain.toml で固定してあり、cargo を呼べば
        # rustup がそれを取ってくる。
        run: |
          cd core
          cargo test

  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the calculation core
        # .wasm はコミットしていないので、使う側のジョブがそのつど作る。
        # toolchain を固定してあるため、どのジョブで作っても同じバイト列。
        run: core/build.sh
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # backend/Dockerfile（Cloud Run で動く実行環境）と同じ系列に揃える。
          python-version: '3.14'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q

  test-frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the calculation core
        # 画面のテストは、本番と同じ .wasm を実際に読み込んで計算を確かめる。
        # ビルドそのもの（npm run build）には要らない（画面は実行時に
        # バックエンドから受け取るため）。
        run: core/build.sh
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        run: |
          cd frontend
          npm test
      - name: Build
        # ビルドが通ること自体をスモークテストとして確認する。キーはダミーでよい。
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
        run: |
          cd frontend
          npm run build

  test-firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore/package-lock.json
      - name: Setup Java
        # Firestore エミュレータの実行に JRE が必要。
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          cd firestore
          npm ci
      - name: Run rules tests
        # emulators:exec がエミュレータの起動・終了を面倒みる。
        run: |
          cd firestore
          npm test
