name: Tests

# 正しさを見る CI。テストを走らせ、そのついでにカバレッジを測り、PR に
# 1 枚の表として貼る。ジョブは「役割」で分かれていて、テストの実行は
# 各スイートのジョブで **1 回だけ**、coverage ジョブは何もビルドせず何も
# 実行しない（測った結果を報告するだけ）:
#
#   test-core / test-backend / test-frontend
#       それぞれのテストを走らせる。カバレッジ計測はテスト実行と同じ 1 回に
#       相乗りさせ（Rust は cargo-llvm-cov、Python は pytest-cov、画面は
#       @vitest/coverage-v8）、結果の Cobertura XML を成果物として渡す。
#       ここが赤いのは **テストが落ちた**（またはカバレッジを測れなかった）
#       という意味。
#   test-firestore-rules
#       エミュレータでルールを検証する。行カバレッジという概念が無いので
#       （測るのはルールの評価であってコードの行ではない）表には出ない。
#   coverage
#       上の 3 つが通ってから、その計測を集計し、この PR が変えた行の
#       カバレッジ（diff-cover）と合わせて 1 つのコメントにする。
#       コンパイラもテストランナーも動かさないので、ここが赤いのは
#       **報告の失敗か、しきい値割れ（表の 🔴）** であってテストの失敗ではない。
#
#   codecov
#       上の 3 つが通ってから、その計測をスイートごとに Codecov へ送る。
#       coverage ジョブとは独立していて、Codecov 側で失敗してもテストや
#       しきい値の判定には影響しない。
#
#   review
#       PR だけ。4 つのテストジョブが全部通ってから、Claude が PR を
#       レビューする（前回の判定があれば、その後の変更だけを再レビュー）。
#       ここが赤いのは **レビューが付かなかった・判定できなかった** という
#       意味で、テストの失敗ではない（詳しくはジョブのコメント）。
#
# レポートは貼り替え式の PR コメント 1 つ、成果物として残る XML、Codecov の
# 3 か所に出る。しきい値で CI を守るのは coverage ジョブだけで、Codecov は
# 推移やファイル別の閲覧のために使う。
#
on:
  push:
    branches:
      - main
  pull_request:
    # 既定の 3 つ（opened・synchronize・reopened）に、Claude のレビューのために
    # ready_for_review を足す（下書きから Ready にしたときにレビューを走らせる。
    # テストもそのとき走り直す）。
    types: [opened, synchronize, reopened, ready_for_review]

# 既定はテストジョブに必要な最小限。coverage ジョブは PR コメントのために
# pull-requests: write を、review ジョブはさらに Anthropic への WIF のために
# id-token: write を追加で持つ。
permissions:
  contents: read

jobs:
  test-core:
    name: Core (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-llvm-cov
        # カバレッジ計測用。ビルド済みバイナリをバージョンと SHA-256 を固定して
        # 取ってくる（`cargo install` は数分かかるうえ、第三者のアクションを
        # 増やしたくない）。更新するときは URL のバージョンと下の checksum を
        # 一緒に差し替えること。
        env:
          VERSION: '0.8.7'
          CHECKSUM: >-
            9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168
        run: |
          set -euo pipefail
          url="https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o cargo-llvm-cov.tar.gz
          echo "${CHECKSUM}  cargo-llvm-cov.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.cargo/bin"
          tar xzf cargo-llvm-cov.tar.gz -C "$HOME/.cargo/bin"
          rm cargo-llvm-cov.tar.gz
      - name: Run tests
        # 釘配列諸定数の計算そのものを検証するのはここだけ（グレー本の計算例・
        # 各関数・入力検証）。画面もサーバも、この実装を wasm として動かす。
        # toolchain は core/rust-toolchain.toml で固定してあり、cargo を呼べば
        # rustup がそれを取ってくる。
        #
        # cargo llvm-cov は cargo test をカバレッジ計測付きで走らせる（テストの
        # 実行はこの 1 回だけ）。計測には llvm-tools が要る。
        run: |
          set -euo pipefail
          cd core
          rustup component add llvm-tools-preview
          cargo llvm-cov --cobertura --output-path coverage.xml
      - name: Normalize coverage paths
        # XML 中のパスをリポジトリのルート基準に直す。3 スイートの計測を
        # 1 つの表と 1 回の diff-cover にまとめるための前処理。
        run: |
          python3 .github/scripts/coverage.py normalize core/coverage.xml \
            --output coverage-core.xml
      - name: Upload coverage measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-core
          path: coverage-core.xml
          if-no-files-found: error

  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the calculation core
        # .wasm はコミットしていないので、使う側のジョブがそのつど作る。
        # toolchain を固定してあるため、どのジョブで作っても同じバイト列。
        run: core/build.sh
      - name: Read the Python version from backend/Dockerfile
        # 本番（Cloud Run）のイメージと同じ系列でテストする。
        id: python-version
        run: .github/scripts/backend-python-version.sh
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run tests
        # --cov-branch まで測るのは、分岐（例外処理・条件分岐）の取りこぼしが
        # 行だけでは見えないため。XML は PR のカバレッジコメント用、term は
        # このログでファイル別に見るため。
        run: |
          cd backend
          python -m pytest -q \
            --cov=app --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml
      - name: Normalize coverage paths
        run: |
          python3 .github/scripts/coverage.py normalize backend/coverage.xml \
            --output coverage-backend.xml
      - name: Upload coverage measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: coverage-backend.xml
          if-no-files-found: error

  test-frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the calculation core
        # 画面のテストは、本番と同じ .wasm を実際に読み込んで計算を確かめる。
        # ビルドそのもの（npm run build）には要らない（画面は実行時に
        # バックエンドから受け取るため）。
        run: core/build.sh
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        # カバレッジの設定（対象・出力形式）は frontend/vite.config.js にある。
        run: |
          cd frontend
          npm run test:coverage
      - name: Normalize coverage paths
        run: |
          python3 .github/scripts/coverage.py normalize \
            frontend/coverage/cobertura-coverage.xml \
            --output coverage-frontend.xml
      - name: Upload coverage measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage-frontend.xml
          if-no-files-found: error
      - name: Build
        # ビルドが通ること自体をスモークテストとして確認する。キーはダミーでよい。
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          # 本番では配らない見本ページ（/design/）も、ここでは含めて組み立てる
          # （本番に出ないページでもビルドが壊れていないことを確かめるため）。
          PORTAL_DESIGN_PAGE: '1'
        run: |
          cd frontend
          npm run build

  test-firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore/package-lock.json
      - name: Setup Java
        # Firestore エミュレータの実行に JRE が必要。
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          cd firestore
          npm ci
      - name: Run rules tests
        # emulators:exec がエミュレータの起動・終了を面倒みる。
        run: |
          cd firestore
          npm test

  codecov:
    name: Codecov upload (${{ matrix.suite }})
    # 3 つのテストジョブが上げた Cobertura XML を Codecov へ送る。スイートごとに
    # flag（core / backend / frontend）を付けて別々に送るので、Codecov 上でも
    # スイート別に見られる。ここでは何もビルドせず、テストも走らせない。
    #
    # 上の coverage ジョブ（PR コメントとしきい値）とは独立している。Codecov 側の
    # 障害や設定漏れで送れなくても、テストの結果やしきい値の判定には影響しない
    # （fail_ci_if_error: false。送れなかったことはこのジョブのログに出る）。
    #
    # 認証はリポジトリシークレット CODECOV_TOKEN（Codecov のリポジトリ設定で
    # 発行する Repository Upload Token）。fork からの PR ではシークレットが
    # 渡らないが、公開リポジトリなら Codecov はトークン無しでも受け付ける。
    needs: [test-core, test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [core, backend, frontend]
    steps:
      - name: Checkout
        # Codecov はコミットと、XML 中のパス（リポジトリ相対に正規化済み）を
        # 実際のファイルに突き合わせるので、ソースが手元に要る。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download coverage measurement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: .
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-${{ matrix.suite }}.xml
          # 指定したファイルだけを送る（チェックアウト内の他の XML を拾わない）。
          disable_search: true
          flags: ${{ matrix.suite }}
          name: ${{ matrix.suite }}
          fail_ci_if_error: false

  coverage:
    name: Coverage report
    # 3 つのテストジョブが通ってから走る（それらの計測がこのジョブの入力）。
    # したがってここの赤は「報告の失敗かしきい値割れ」であって、テストの
    # 失敗ではない。ここでは何もビルドせず、テストも走らせない。
    needs: [test-core, test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # カバレッジコメントの投稿・貼り替えに要る。
      pull-requests: write
    steps:
      - name: Checkout
        # 全履歴（fetch-depth: 0）で取る。diff-cover は「この PR が変えた行」
        # だけを見るので、ベースブランチとのマージベースが手元に要る。浅い
        # クローンを後から深めるやり方は、履歴の浅いリポジトリでマージベース
        # に届かず diff-cover が止まることがあるので採らない。このリポジトリの
        # 履歴は小さく、全部取っても誤差の範囲。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install reporting tools
        # diff-cover は Python の CLI。pipx（ランナーに同梱）で入れると
        # PEP 668 の externally-managed-environment を避けられる。
        # 計測は済んでいるので、コンパイラも計測ツールも要らない。
        run: pipx install diff-cover
      - name: Download coverage measurements
        # 3 つのテストジョブが上げた Cobertura XML（パスはリポジトリ相対に
        # 正規化済み）を、チェックアウトの隣に展開する。
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .
      - name: Summarize coverage
        run: |
          python3 .github/scripts/coverage.py summary \
            --output coverage-summary.json \
            core=coverage-core.xml \
            backend=coverage-backend.xml \
            frontend=coverage-frontend.xml
      - name: Compute diff coverage vs. base branch
        # この PR が足した・変えた行だけのカバレッジ。3 つの計測をまとめて
        # 渡せるのは、パスをリポジトリ相対に正規化してあるため。push（main）の
        # ときは比べる相手がいないので測らない。
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # チェックアウトは全履歴なのでマージベースは手元にある。origin/<base>
          # として解決できるよう、ベースブランチだけ remotes へ写す。
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          diff-cover coverage-core.xml coverage-backend.xml \
            coverage-frontend.xml \
            --compare-branch "origin/$BASE_REF" \
            --total-percent-float \
            --format "json:diff-cover.json" \
            --fail-under 0
      - name: Upload coverage report
        # 集計と差分。スイートごとの生の計測は各テストジョブの成果物として
        # すでに残っている。
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage-summary.json
            diff-cover.json
          if-no-files-found: ignore
      - name: Report coverage & enforce thresholds
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // 自分の前のコメントを見つけて貼り替えるための目印。PR には
            // 常に最新のカバレッジコメントが 1 つだけ残る。
            const marker = '<!-- coverage-report -->';

            const pct = (n) =>
              (typeof n === 'number') ? `${n.toFixed(1)}%` : '—';

            // 行カバレッジのしきい値（%）。green 以上なら 🟢、yellow 以上なら
            // 🟡、それ未満は 🔴 でジョブが落ちる。yellow は「ここを割ったら
            // 落とす」下限、green は「目指す水準」。数字は現状（core 95 /
            // backend 92 / frontend 47）から、下げ止まりを検出できる位置に
            // 置いてある。上がったら一緒に上げること。
            //
            // 画面（frontend）の下限が低いのは、ブラウザの入口
            // （各ツールの main.js・auth.js・api.js など）を単体テストが
            // 読み込まないため。ロジックは form-logic.js / form-dom.js 側へ
            // 寄せてあり、そちらはほぼ 100% 覆われている。
            //
            // 分岐（branches）は参考値なので常に ⚪、しきい値も持たない
            // （Rust の計測に分岐の情報が無く、3 スイートで足すと意味の違う
            // 数を混ぜることになるため）。
            const THRESHOLDS = {
              core: { green: 95, yellow: 90 },
              backend: { green: 95, yellow: 85 },
              frontend: { green: 90, yellow: 45 },
              overall: { green: 90, yellow: 70 },
              diff: { green: 100, yellow: 80 },
            };
            const badge = (metric, n) => {
              const t = THRESHOLDS[metric];
              if (!t || typeof n !== 'number') return '⚪';
              if (n >= t.green) return '🟢';
              if (t.yellow !== undefined && n >= t.yellow) return '🟡';
              return '🔴';
            };

            // 表は 1 つ。スイートごとの行カバレッジ → 全体 → 参考の分岐 →
            // 最後にこの PR が変えた行のカバレッジ、の順に積む。
            const LABELS = {
              core: 'Core (Rust)',
              backend: 'Backend (Python)',
              frontend: 'Frontend (JS)',
            };
            const rows = [];

            try {
              const s = JSON.parse(
                fs.readFileSync('coverage-summary.json', 'utf8'));
              for (const suite of s.suites) {
                rows.push([
                  `Lines — ${LABELS[suite.name] ?? suite.name}`,
                  `${badge(suite.name, suite.line_percent)} ` +
                    `${pct(suite.line_percent)}`,
                  `${suite.line_covered} / ${suite.line_total}`,
                ]);
              }
              rows.push([
                'Lines (overall)',
                `${badge('overall', s.overall.line_percent)} ` +
                  `${pct(s.overall.line_percent)}`,
                `${s.overall.line_covered} / ${s.overall.line_total}`,
              ]);
              if (s.overall.branch_total > 0) {
                rows.push([
                  'Branches (overall)',
                  `⚪ ${pct(s.overall.branch_percent)}`,
                  `${s.overall.branch_covered} / ${s.overall.branch_total}`,
                ]);
              }
            } catch (e) {
              core.warning(`Could not read coverage summary: ${e}`);
            }

            try {
              const d = JSON.parse(fs.readFileSync('diff-cover.json', 'utf8'));
              const total = d.total_num_lines;
              const covered = total - d.total_num_violations;
              if (total > 0) {
                const p = d.total_percent_covered;
                rows.push([
                  '**Diff (changed lines)**',
                  `${badge('diff', p)} **${pct(p)}**`,
                  `**${covered} / ${total}**`,
                ]);
              } else {
                rows.push([
                  '**Diff (changed lines)**', '⚪ **—**',
                  '_no covered lines changed_',
                ]);
              }
            } catch (e) {
              core.warning(`Could not read diff-cover report: ${e}`);
            }

            // 🔴 が 1 つでもあれば、しきい値割れ。
            const hasRed = rows.some((r) => r[1].includes('🔴'));

            const table = rows.length
              ? [
                  '| Metric | Coverage | Covered / Total |',
                  '| --- | ---: | ---: |',
                  ...rows.map((r) => `| ${r[0]} | ${r[1]} | ${r[2]} |`),
                ].join('\n')
              : '_Coverage report unavailable._';

            // コメントは同一リポジトリからの PR にだけ貼る（fork からの PR は
            // トークンが読み取り専用で貼れない。しきい値の判定は下で必ず走る）。
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const isSameRepoPr =
              pr && pr.head.repo.full_name === `${owner}/${repo}`;

            if (isSameRepoPr) {
              const sha = pr.head.sha.slice(0, 7);
              const body = [
                marker,
                '### 🧪 Test coverage report',
                '',
                table,
                '',
                'スイートごとの行カバレッジと、この PR が変えた行だけの' +
                  'カバレッジ（ベースブランチとの差分）。' +
                  'Firestore ルールはエミュレータでの評価であり' +
                  '行カバレッジを出せないため、この表には含まない。',
                '',
                `<sub>Generated by the \`coverage\` job · commit ${sha}</sub>`,
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments(
                { owner, repo, issue_number: pr.number, per_page: 100 });
              const existing = comments.find(
                (c) => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment(
                  { owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment(
                  { owner, repo, issue_number: pr.number, body });
              }
            }

            // 🔴 があればジョブを落とす（表示するだけでなく、CI で守る）。
            if (hasRed) {
              core.setFailed(
                'Coverage below threshold: one or more metrics are 🔴. ' +
                'See the coverage table above.');
            }

  review:
    name: Claude review
    # Claude（PR エージェント）による自動レビュー。レビューの中身は Anthropic 公式の
    # code-review プラグイン（`/code-review:code-review`）に任せ、ここでは
    # プロンプトを書かない。何を見るか・どの指摘を捨てるかはプラグインが決める
    # （並列のエージェントで CLAUDE.md 準拠とバグを見て、確信度の低い指摘を捨てる）。
    # リポジトリ固有の観点は CLAUDE.md に書けば、プラグインがそれに照らして見る。
    #
    # プラグインは Claude Agent SDK で動かす（.github/scripts/claude-review.mjs）。
    # claude-code-action は中身が Claude Code で、Max / Team プランに付く API
    # クレジットの対象外のため使わない（Agent SDK は対象）。
    #
    # API は Claude Platform を Workload Identity Federation（WIF）で使う。GitHub の
    # OIDC トークンを短命の Anthropic トークンに交換するので、API キー（Secrets）は
    # 持たない。コメントと判定は GITHUB_TOKEN（github-actions[bot]）の名義で付く。
    #
    # 無駄打ちを防ぐため、下書きの間はレビューしない。運用は
    #
    #   1. PR は下書きで作る（作業中の push ではレビューが走らない）
    #   2. 案がまとまったら「Ready for review」に切り替える → PR 全体を 1 回レビュー
    #   3. 指摘に対応して push する → 前回の判定から後の変更だけを再レビュー
    #
    # 走るのは、Ready の PR に次のことが起きたとき（ready_for_review は、この
    # ジョブのためにワークフローのトリガーに足してある。Ready にしたときもテストが
    # 走り直す）:
    #
    #   ready_for_review  下書きから Ready へ
    #   opened            最初から Ready で開いた
    #   reopened          Ready のまま開き直した（閉じる前にレビューが付かなかった
    #                     場合の取りこぼしを拾う）
    #   synchronize       push した
    #
    # どのイベントでも、何をするかは前回の判定（Approve / Request changes。
    # claude-review-status.sh の verdict・verdict_sha）で決める:
    #
    #   判定が無い                    PR 全体をレビューする（プラグインのコマンド）
    #   判定があり、head が変わった   前回の判定の head からの差分を再レビューする
    #   判定があり、head が同じ       何もしない（開き直し・下書きとの行き来など）
    #
    # どの場合も、上のテストジョブが全部通ってから走る（needs）。テストが落ちる
    # 変更をレビューしても、直した後にもう一度レビューすることになるため。テストが
    # 落ちたらこのジョブは走らない。落ちたジョブを再実行して（Re-run failed jobs）
    # 通れば、このジョブも続けて走る。テストの間に push されていたら（head が
    # 進んでいたら）、その実行はレビューせずに終える（新しい head の実行がレビュー
    # する）。
    #
    # 再レビューでは、差分のうち PR の差分にも含まれる行だけを見る（ベースブランチを
    # 取り込んだ分は見ない）。前回までの指摘が直っていなければ付け直す。force push
    # で前回の head が祖先でなくなっていたら PR 全体を見る（claude-review.mjs）。
    # 新しい判定は前の判定を置き換える（GitHub は同じレビュアーの最新の判定を
    # 有効にする）。
    #
    # プラグインは「レビュー不要」「Claude が既にコメントした」と判断すると何も
    # 書かずに終わる。そのまま緑で終えると、Ready なのに未レビューの PR が
    # 気付かれずに残るので、最後にレビューが付いたかを確かめ、付いていなければ
    # ジョブを失敗にする。
    #
    # レビューが付いたら、その結果を PR のレビュー（Approve / Request changes）として
    # 出す。指摘があればプラグインはインラインコメントを付け、無ければ
    # 「No issues found」のコメントを 1 件付けるので、判定はそれに従う
    # （判定はここで機械的に行い、プラグインには何も足さない）。
    #
    # bot（Dependabot など）の PR は対象外。依存の更新は CI とプレビューで見る。
    # フォークからの PR も対象外（OIDC トークンが出ないので、WIF が通らない）。
    #
    # PR のイベントでは、PR 側のこのワークフローが動く。つまりこのジョブを
    # 変える PR も、変えた後の内容でレビューされる。
    #
    # 必要な設定（Claude Console 側の WIF、リポジトリ変数）は
    # README「Claude による PR レビュー（PR エージェント）」を参照。
    needs: [test-core, test-backend, test-frontend, test-firestore-rules]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 同じ PR のレビューは 1 本ずつ。走っている実行は止めない（途中で止めると、
    # コメントを一部だけ付けて判定の無い状態が残る）。後から来た実行は待ち、
    # 前の実行の判定から後の変更だけを見る。続けて push したときは、待っている
    # 実行が新しいものに置き換わるので、まとめて 1 回になりやすい。
    concurrency:
      # push（main）では if で飛ぶが、式が空にならないよう run_id で埋める。
      group: claude-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # GitHub の OIDC トークンの取得に使う（Anthropic への WIF）。
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 取り出すのは PR のマージコミット。再レビューで前回の head との差分を
          # 取るため、履歴ごと取る（PR の head はマージコミットの親として手元に
          # ある）。Claude はここのファイルを読めるので、GITHUB_TOKEN は残さない。
          fetch-depth: 0
          persist-credentials: false
      - name: Check required repository variables
        # 未設定のリポジトリ変数は空文字として展開される。WIF の値が欠けると
        # 交換は「Authentication failed」としか返らず原因が読めないので、
        # 先にここで変数名を挙げて落とす。
        env:
          ANTHROPIC_FEDERATION_RULE_ID: '${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}'
          ANTHROPIC_ORGANIZATION_ID: '${{ vars.ANTHROPIC_ORGANIZATION_ID }}'
          ANTHROPIC_SERVICE_ACCOUNT_ID: '${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}'
        run: |
          .github/scripts/require-vars.sh \
            ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID
      - name: Find the previous verdict
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claude-review-status.sh
      - name: Decide what to review
        # mode は review（PR 全体）・rereview（前回の判定からの差分）・none
        # （何もしない）。テストの間に head が進んでいたら none（新しい head の
        # 実行がレビューする）。再レビューの base は差分の起点で、前回の head が
        # 今の head の祖先でなければ空（PR 全体を見る）。
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.before.outputs.verdict }}
          PREVIOUS_SHA: ${{ steps.before.outputs.verdict_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::notice::PR #${PR} の head が ${HEAD_SHA} から ${current} に進んだので、この実行ではレビューしません（新しい head の実行がレビューする）。"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$VERDICT" != 'true' ]; then
            echo "mode=review" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PREVIOUS_SHA" = "$HEAD_SHA" ]; then
            echo "::notice::前回の判定（${PREVIOUS_SHA}）から変更が無いので、レビューしません。"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=''
          if git cat-file -e "${PREVIOUS_SHA}^{commit}" 2> /dev/null &&
              git merge-base --is-ancestor "$PREVIOUS_SHA" "$HEAD_SHA"; then
            base="$PREVIOUS_SHA"
            echo "前回の判定（${PREVIOUS_SHA}）からの差分を再レビューします。"
          else
            echo "::warning::前回の判定の head（${PREVIOUS_SHA}）が今の head の祖先ではありません（force push など）。PR 全体を再レビューします。"
          fi
          {
            echo "mode=rereview"
            echo "previous=$PREVIOUS_SHA"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
      - name: Record the start time
        # この実行で付いたコメントだけを数えるための基準。GitHub 側の時刻との
        # ずれを見込んで 1 分前にする。
        id: start
        if: steps.plan.outputs.mode != 'none'
        run: echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        if: steps.plan.outputs.mode != 'none'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the Agent SDK and the plugin
        # SDK は固定する（レビューを動かす仕組みなので、他のアクションと同じ扱い）。
        # プラグインはレビューの指示そのもので、このリポジトリのコードの動作には
        # 関わらないため、固定せず毎回 anthropics/claude-code の最新を取る。
        # どちらもワークスペースの外（RUNNER_TEMP）に置く（レビュー対象に混ぜない）。
        if: steps.plan.outputs.mode != 'none'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-review"
          mkdir -p "$dir"
          cp .github/scripts/claude-review.mjs "$dir/"
          (
            cd "$dir"
            npm init -y > /dev/null
            npm install --no-audit --no-fund --ignore-scripts \
              @anthropic-ai/claude-agent-sdk@0.3.310 zod@4.6.7
          )
          git clone -q --depth 1 https://github.com/anthropics/claude-code.git "$dir/claude-code"
          echo "プラグイン: anthropics/claude-code@$(git -C "$dir/claude-code" rev-parse HEAD)"
          echo "PLUGIN_DIR=$dir/claude-code/plugins/code-review" >> "$GITHUB_ENV"
      - name: Review with the code-review plugin
        # PREVIOUS_SHA があれば再レビュー（claude-review.mjs）。
        if: steps.plan.outputs.mode != 'none'
        env:
          # WIF。これらは ID であって秘密ではないので、Variables に置く。
          # ANTHROPIC_API_KEY は渡さないこと（静的な鍵があると WIF より優先される）。
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # ルールが 1 つのワークスペースだけを対象にしているなら空でよい。
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIOUS_SHA: ${{ steps.plan.outputs.previous }}
          REVIEW_BASE: ${{ steps.plan.outputs.base }}
        run: node "$RUNNER_TEMP/claude-review/claude-review.mjs"
      - name: Check that the review was posted
        id: after
        if: steps.plan.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.start.outputs.since }}
          RETRIES: '5'
        run: .github/scripts/claude-review-status.sh
      - name: Fail when a ready PR is left unreviewed
        # 実行中に下書きへ戻された・閉じられた PR は、Ready ではないので問わない。
        if: steps.plan.outputs.mode != 'none' && steps.after.outputs.state == 'open' && steps.after.outputs.reviewed != 'true'
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          if [ "$MODE" = 'rereview' ]; then
            echo "::error::PR #${PR} の再レビューが付きませんでした。実行ログを確認し、このジョブを再実行してください。"
          else
            echo "::error::PR #${PR} は Ready ですが、レビューが付きませんでした。プラグインが「レビュー不要」または「Claude が既にコメント済み」と判断した可能性があります。実行ログを確認してください。"
            echo "::error::PR に Claude のコメントが既にある場合（\`@claude\` とのやり取りや、中断された実行の残りなど）は、プラグインが毎回同じ理由で飛ばすため、再実行では解消しません。人がレビューするか、それらのコメントを消してから再実行してください。"
          fi
          exit 1
      - name: Submit the review verdict
        # 指摘あり（インラインコメントがある）→ Request changes、
        # 「No issues found」のまとめだけ → Approve。どちらでもない（まとめは
        # あるが「No issues found」を含まない）なら、判定せずに落とす。
        #
        # 本文の目印（claude-review-status.sh の MARKER）が「判定まで済んだ」の
        # 印になる。
        #
        # 出すのは GITHUB_TOKEN（github-actions[bot]）。Approve には Settings →
        # Actions → General の「Allow GitHub Actions to create and approve pull
        # requests」が要る（howtec-worksheet-check.yml の PR 作成と同じ設定）。
        if: steps.plan.outputs.mode != 'none' && steps.after.outputs.state == 'open' && steps.after.outputs.reviewed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INLINE: ${{ steps.after.outputs.inline }}
          CLEAN: ${{ steps.after.outputs.clean }}
          KIND: ${{ steps.plan.outputs.mode == 'rereview' && '再レビュー' || 'レビュー' }}
          MARKER: '<!-- claude-review-verdict -->'
        run: |
          set -euo pipefail
          if [ "$INLINE" -gt 0 ]; then
            gh pr review "$PR" --request-changes \
              --body "$(printf '%s\n\nClaude の%sで指摘が %s 件ありました。インラインコメントを確認してください。' "$MARKER" "$KIND" "$INLINE")"
          elif [ "$CLEAN" -gt 0 ]; then
            if ! gh pr review "$PR" --approve \
                --body "$(printf '%s\n\nClaude の%sで指摘はありませんでした。' "$MARKER" "$KIND")"; then
              echo "::error::Approve できませんでした。Settings → Actions → General の「Allow GitHub Actions to create and approve pull requests」が有効か確認してください（README「Claude による PR レビュー（PR エージェント）」参照）。"
              exit 1
            fi
          else
            echo "::error::Claude のまとめコメントに「No issues found」が無く、インラインコメントもありません。指摘の有無を判定できないので、まとめコメントを確認して人が判定してください。"
            exit 1
          fi
