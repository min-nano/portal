name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# The test jobs only need to read the repository contents.
permissions:
  contents: read

jobs:
  test-core:
    name: Core (cargo + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        # toolchain は core/rust-toolchain.toml で固定してある（成果物の
        # バイト列を再現できるようにするため）。cargo を 1 度呼べば、rustup が
        # その toolchain と wasm32 ターゲットを取ってくる。
        run: |
          cd core
          cargo --version
      - name: Run tests
        # 式ごとの検証（グレー本の計算例・各関数・入力検証）はここにある。
        run: |
          cd core
          cargo test
      - name: Check the committed wasm is up to date
        # backend/app/wasm/*.wasm はコミットしてある成果物。ソースを変えた
        # のに作り直していないと、画面とサーバが古い計算のまま動いてしまう。
        # 同じ toolchain なら同じバイト列が出るので、突き合わせて確かめる。
        run: |
          cd core
          cargo build --release --target wasm32-unknown-unknown
          if ! cmp -s target/wasm32-unknown-unknown/release/nail_array_core.wasm \
                     ../backend/app/wasm/nail_array_core.wasm; then
            echo "::error file=backend/app/wasm/nail_array_core.wasm::core/ の変更が成果物に反映されていません。core/build.sh を実行して、作り直した .wasm もコミットしてください。"
            exit 1
          fi

  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # backend/Dockerfile（Cloud Run で動く実行環境）と同じ系列に揃える。
          python-version: '3.14'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q

  test-frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        run: |
          cd frontend
          npm test
      - name: Build
        # ビルドが通ること自体をスモークテストとして確認する。キーはダミーでよい。
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
        run: |
          cd frontend
          npm run build

  test-firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore/package-lock.json
      - name: Setup Java
        # Firestore エミュレータの実行に JRE が必要。
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          cd firestore
          npm ci
      - name: Run rules tests
        # emulators:exec がエミュレータの起動・終了を面倒みる。
        run: |
          cd firestore
          npm test
