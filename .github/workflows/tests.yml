name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# The test jobs only need to read the repository contents.
permissions:
  contents: read

jobs:
  test-backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q

  test-frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run tests
        run: |
          cd frontend
          npm test
      - name: Build
        # ビルドが通ること自体をスモークテストとして確認する。キーはダミーでよい。
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
        run: |
          cd frontend
          npm run build

  test-firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore/package-lock.json
      - name: Setup Java
        # Firestore エミュレータの実行に JRE が必要。
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          cd firestore
          npm ci
      - name: Run rules tests
        # emulators:exec がエミュレータの起動・終了を面倒みる。
        run: |
          cd firestore
          npm test
