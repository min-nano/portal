name: Agent SDK smoke test

# 検証用（結果を見たら消す）。claude-review.yml は claude-code-action（中身は
# Claude Code）で動かしているが、Max プランの API クレジットは Claude Code を
# 対象にしないため、モデル呼び出しが通らない。対象に含まれる使い方なら同じ
# WIF のトークンで通るかを、1 回ずつ試して結果（エラーの本文を含む）を出す。
#
#   Claude API（Messages）  ……クレジットの対象。通らなければ WIF・権限側の問題
#   Claude Agent SDK         ……クレジットの対象のはず。通ればレビューをこれで組む
#
# GitHub の OIDC トークンは 1 回の交換にしか使えない（jti）ので、試すたびに
# 取り直す。

on:
  pull_request:
    paths:
      - .github/workflows/agent-sdk-smoke.yml
      - .github/scripts/agent-sdk-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check required repository variables
        run: |
          .github/scripts/require-vars.sh \
            ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID
      - name: Install the SDKs
        # リポジトリの package.json には足さない（検証が済んだら消すため）。
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          cp .github/scripts/agent-sdk-smoke.mjs "$dir/"
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts \
            @anthropic-ai/sdk@1.3.0 @anthropic-ai/claude-agent-sdk@0.3.310
          # ジョブの env では runner コンテキストが使えないので、ここで決める。
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/anthropic-identity-token" >> "$GITHUB_ENV"
      - name: Claude API (Messages)
        id: messages
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          node "$RUNNER_TEMP/smoke/agent-sdk-smoke.mjs" messages
      - name: Claude Agent SDK
        id: agent
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          node "$RUNNER_TEMP/smoke/agent-sdk-smoke.mjs" agent-sdk
      - name: Summary
        env:
          MESSAGES: ${{ steps.messages.outcome }}
          AGENT: ${{ steps.agent.outcome }}
        run: |
          echo "Claude API (Messages): $MESSAGES"
          echo "Claude Agent SDK:      $AGENT"
          [ "$MESSAGES" = success ] && [ "$AGENT" = success ]
