version: 2

updates:
  # GitHub Actions (.github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"

  # フロントエンド (Vite / Vitest)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Firestore ルールのテスト環境
  - package-ecosystem: npm
    directory: "/firestore"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - firestore
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # バックエンド (FastAPI / requirements.txt)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"

  # バックエンドの Cloud Run 用コンテナ
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
